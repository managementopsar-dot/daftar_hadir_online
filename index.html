<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2559">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Presensi Rapat Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2559; --navy2:#2C3B91; --navy3:#0F1638;
  --orange:#F26B1D; --orange2:#FF8A3D; --red:#E3262E;
  --bg:#F3F5FA; --card:#FFFFFF; --ink:#141A33; --muted:#69708F; --line:#E2E6F0; --soft:#EEF1F8;
  --ok:#12A150; --okbg:#E7F7EE; --bad:#D92D20; --badbg:#FDECEA; --warn:#B54708; --warnbg:#FEF4E6;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 2px rgba(20,26,51,.06),0 8px 24px rgba(20,26,51,.06);
  --shadow-lg:0 20px 60px rgba(15,22,56,.25);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy2)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.92em;letter-spacing:.02em}

/* ---------- Topbar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand img{height:30px;width:auto}
.brand b{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.bad{background:var(--badbg);color:var(--bad)}
@media (max-width:560px){.brand div{display:none}.hide-sm{display:none}}

/* ---------- Layout ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-pad{padding:20px}
h1,h2,h3{margin:0;line-height:1.2;letter-spacing:-.01em}
h1{font-size:clamp(26px,4.5vw,40px);font-weight:800}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;margin-bottom:14px;background:none;border:0;cursor:pointer;padding:0}
.back:hover{color:var(--ink)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;transition:transform .08s,background .15s,box-shadow .15s;text-decoration:none;white-space:nowrap;min-height:42px}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--navy);color:#fff;box-shadow:0 4px 14px rgba(27,37,89,.25)}
.btn-primary:hover{background:var(--navy2)}
.btn-accent{background:var(--orange);color:#fff;box-shadow:0 4px 14px rgba(242,107,29,.3)}
.btn-accent:hover{background:var(--orange2)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--soft)}
.btn-danger{background:var(--bad);color:#fff}
.btn-danger-ghost{background:#fff;border-color:#F6C9C4;color:var(--bad)}
.btn-danger-ghost:hover{background:var(--badbg)}
.btn-sm{padding:6px 10px;min-height:34px;font-size:13px;border-radius:9px}
.btn-icon{width:36px;min-height:36px;padding:0;border-radius:10px}
.btn svg{width:18px;height:18px;flex:none}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:#3A4166}
.field .hint{font-size:12px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;outline:none;transition:border .15s,box-shadow .15s;min-height:44px}
.input:focus{border-color:var(--navy2);box-shadow:0 0 0 4px rgba(44,59,145,.12)}
.input-group{display:flex;gap:8px}
.input-group .input{flex:1;min-width:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:600px){.grid-2{grid-template-columns:1fr}}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px}
.switch input{width:20px;height:20px;accent-color:var(--navy);flex:none}

/* ---------- Home ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(1200px 400px at 110% -20%,rgba(242,107,29,.35),transparent 60%),linear-gradient(135deg,var(--navy3),var(--navy) 55%,var(--navy2));color:#fff;padding:36px 28px 120px}
.hero::after{content:"";position:absolute;right:-60px;bottom:40px;width:520px;height:16px;background:linear-gradient(90deg,transparent,var(--orange));transform:rotate(-12deg);border-radius:99px;opacity:.9}
.hero::before{content:"";position:absolute;right:-60px;bottom:70px;width:360px;height:6px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5));transform:rotate(-12deg);border-radius:99px}
.hero .eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.12);padding:6px 12px;border-radius:99px;margin-bottom:16px}
.hero p{max-width:620px;color:rgba(255,255,255,.8);font-size:16px;margin:12px 0 0;position:relative;z-index:1}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:-88px 16px 0;position:relative;z-index:2}
@media (max-width:720px){.choices{grid-template-columns:1fr;margin:-88px 8px 0}}
.choice{display:flex;flex-direction:column;gap:12px;text-align:left;padding:24px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none;color:var(--ink)}
.choice:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(20,26,51,.12)}
.choice .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center}
.choice .ic svg{width:28px;height:28px}
.choice.p .ic{background:#FFF0E6;color:var(--orange)}
.choice.a .ic{background:#E9ECFA;color:var(--navy2)}
.choice h3{font-size:19px}
.choice .go{margin-top:auto;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.choice.p .go{color:var(--orange)} .choice.a .go{color:var(--navy2)}
.caps{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.capnote{margin-top:14px;font-size:13px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px 14px}

/* ---------- Event list ---------- */
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:16px}
.ev{display:flex;gap:16px;padding:18px;cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:left;width:100%;font:inherit}
.ev:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(20,26,51,.1)}
.datebox{flex:none;width:64px;border-radius:14px;background:var(--navy);color:#fff;text-align:center;padding:8px 4px;line-height:1.1}
.datebox .d{font-size:26px;font-weight:800}
.datebox .m{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.datebox.today{background:var(--orange)}
.ev h3{font-size:16px;margin-bottom:4px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted)}
.badge.ok{background:var(--okbg);color:var(--ok)} .badge.org{background:#FFF0E6;color:#C2410C} .badge.gray{background:#EEF0F5;color:#5B6280}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.4;margin-bottom:8px}

/* ---------- Kiosk ---------- */
.kiosk{display:grid;grid-template-columns:380px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.kiosk{grid-template-columns:minmax(0,1fr)}}
.meta-card{background:linear-gradient(135deg,var(--navy3),var(--navy));color:#fff;border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.meta-card::after{content:"";position:absolute;right:-40px;bottom:16px;width:240px;height:8px;background:var(--orange);transform:rotate(-12deg);border-radius:9px}
.meta-card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:14px 0 0;font-size:14px}
.meta-card dt{opacity:.7;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.meta-card dd{margin:0;font-weight:700}
.counter{display:flex;align-items:baseline;gap:8px;margin-top:16px;position:relative;z-index:1}
.counter b{font-size:40px;font-weight:800;line-height:1}
.scan{padding:28px 20px;text-align:center}
.radar{position:relative;width:180px;height:180px;margin:6px auto 18px;display:grid;place-items:center}
.radar .core{width:104px;height:104px;border-radius:50%;background:linear-gradient(135deg,var(--orange),#FF9A55);display:grid;place-items:center;color:#fff;box-shadow:0 12px 30px rgba(242,107,29,.4);z-index:2;position:relative}
.radar .core svg{width:52px;height:52px}
.radar .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(242,107,29,.45);animation:ping 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.radar .ring:nth-child(2){animation-delay:.8s}.radar .ring:nth-child(3){animation-delay:1.6s}
.radar.busy .core{animation:pulse .8s ease-in-out infinite alternate}
@keyframes ping{0%{transform:scale(.55);opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes pulse{to{transform:scale(1.06)}}
.scan h2{font-size:22px}
.readers{display:flex;flex-direction:column;gap:8px;margin-top:18px;text-align:left}
.reader{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:13px}
.reader .ri{width:30px;height:30px;border-radius:9px;background:#fff;display:grid;place-items:center;flex:none;color:var(--navy2)}
.reader .ri svg{width:17px;height:17px}
.reader b{display:block;font-size:13px}
.reader span{color:var(--muted);font-size:12px}
.reader .btn{margin-left:auto}
.reader.on{background:var(--okbg)} .reader.on .ri{color:var(--ok)}
.reader.off .ri{color:#9AA1BC}

/* ---------- Table ---------- */
.tbl-wrap{overflow:auto;border-radius:0 0 var(--r) var(--r)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{position:sticky;top:0;background:#F7F8FC;text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:12px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.flash td{animation:flash 2.4s ease-out}
@keyframes flash{0%{background:#FFE7D6}100%{background:transparent}}
.tbl .no{width:44px;text-align:center;font-weight:800;color:var(--muted)}
.tbl .acts{white-space:nowrap;text-align:right}
.qr{display:inline-flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.qr svg{width:46px;height:46px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px;flex:none}
.qr small{font-size:11px;color:var(--muted);line-height:1.25}
.name-cell b{display:block}
.name-cell small{color:var(--muted)}
@media (max-width:760px){
  table.tbl.stack thead{display:none}
  table.tbl.stack,table.tbl.stack tbody,table.tbl.stack tr,table.tbl.stack td{display:block;width:100%}
  table.tbl.stack tr{padding:12px 14px;border-bottom:1px solid var(--line);position:relative}
  table.tbl.stack td{border:0;padding:3px 0;display:flex;gap:10px;text-align:left}
  table.tbl.stack td::before{content:attr(data-l);flex:none;width:96px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:3px}
  table.tbl.stack td.no{position:absolute;right:12px;top:12px;width:auto;display:block}
  table.tbl.stack td.no::before{display:none}
  table.tbl.stack td.acts{justify-content:flex-start;padding-top:8px}
  table.tbl.stack td.acts::before{display:none}
}

/* ---------- Admin ---------- */
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:5px;overflow-x:auto;margin-bottom:18px;box-shadow:var(--shadow)}
.tab{flex:1;min-width:max-content;border:0;background:none;padding:10px 16px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px}
.tab svg{width:18px;height:18px}
.tab.on{background:var(--navy);color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:38px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{padding:16px 18px}
.stat small{color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.stat b{display:block;font-size:28px;font-weight:800;margin-top:2px}

/* ---------- Login ---------- */
.auth{max-width:420px;margin:20px auto}
.auth .card{padding:28px}
.auth .logo{height:44px;margin-bottom:16px}

/* ---------- Modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,56,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:20px;width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:var(--shadow-lg);animation:pop .18s cubic-bezier(.2,.8,.3,1.2)}
.modal.sm{max-width:420px}
.modal-h{padding:20px 22px 0;display:flex;gap:14px;align-items:center}
.modal-h .mi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.modal-h .mi svg{width:24px;height:24px}
.mi.info{background:#E9ECFA;color:var(--navy2)} .mi.danger{background:var(--badbg);color:var(--bad)} .mi.ok{background:var(--okbg);color:var(--ok)} .mi.warn{background:var(--warnbg);color:var(--warn)}
.modal-b{padding:16px 22px}
.modal-f{padding:0 22px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal-f .btn{min-width:110px}
@media (max-width:480px){.modal-f .btn{flex:1}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:14px;background:var(--soft);border-radius:12px;padding:14px;margin:0}
.kv dt{color:var(--muted);font-weight:600;font-size:13px}
.kv dd{margin:0;font-weight:700;word-break:break-word}
.big-qr{display:flex;justify-content:center;margin:6px 0 12px}
.big-qr svg{width:200px;height:200px;padding:10px;border:1px solid var(--line);border-radius:14px;background:#fff}
.countdown{height:4px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:12px}
.countdown i{display:block;height:100%;background:var(--orange);animation:cd linear forwards}
@keyframes cd{from{width:100%}to{width:0}}

/* ---------- Toast ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px);pointer-events:none}
.toast{background:var(--navy3);color:#fff;padding:12px 16px;border-radius:14px;box-shadow:var(--shadow-lg);font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center;animation:pop .2s}
.toast.ok{background:#0E7A3E}.toast.bad{background:#B42318}.toast.warn{background:#93370D}
.toast svg{width:20px;height:20px;flex:none}

.spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.spinner.dark{border-color:rgba(27,37,89,.15);border-top-color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
.loading{display:flex;justify-content:center;padding:40px}
.demo-bar{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo-bar select{max-width:100%}
.verify{max-width:520px;margin:10px auto}
.vstat{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 20px 8px;text-align:center}
.vstat .vi{width:72px;height:72px;border-radius:50%;display:grid;place-items:center}
.vstat .vi svg{width:40px;height:40px}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 30px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <a class="brand" href="#/" id="brandLink"><img id="brandLogo" alt="Logo"><div><small>Presensi Rapat</small><b>Daftar Hadir Digital</b></div></a>
  <div class="spacer"></div>
  <span class="pill" id="modePill"><span class="dot"></span><span>…</span></span>
  <span id="topActions"></span>
</div></header>
<main class="wrap" id="app"><div class="loading"><div class="spinner dark"></div></div></main>
<div class="foot" id="foot"></div>
<div id="modals"></div>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
/* =====================================================================
 *  KONFIGURASI
 *  API_URL : isi dengan URL Web App Apps Script (…/exec) bila halaman ini
 *            di-hosting sendiri (GitHub Pages / Netlify / server kantor)
 *            — WAJIB agar NFC di HP Android berfungsi.
 *            Kosong => bila dibuka dari URL Apps Script otomatis memakai
 *            google.script.run; bila dibuka di luar => MODE DEMO (data
 *            tersimpan di browser ini saja).
 * ===================================================================== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwvJn6eaBR5TtQylPf_HyXPJPdmgNl73CO9E2rbVO7dOluGT4-rNGcM6H7kiXW9eVjgAA/exec',
  KIOSK_REFRESH_MS: 15000,

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
const pad = n => String(n).padStart(2, '0');
const todayYmd = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const nowIso = () => { const d = new Date(); return `${todayYmd()}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const parseYmd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };

 * ===================================================================== */
const Reader = {
  handler: null, last: '', lastT: 0,
  inIframe: (() => { try { return window.self !== window.top; } catch (e) { return true; } })(),
  isIOS: /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),

  get nfcUsable() { return this.nfcApi && window.isSecureContext && !this.inIframe; },
  nfcReason() {

    if (!window.isSecureContext) return 'Web NFC wajib dibuka lewat HTTPS';

  on(fn) { this.handler = fn; },
  off() { this.handler = null; },

  async startNFC() {

    r.onreading = e => {
      if (!e.serialNumber) { toast('Kartu terbaca tetapi nomor serinya tidak tersedia untuk browser', 'warn'); return; }

      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) { buf = ''; return; }

function openModal({ title, body = '', icon = 'info', tone = 'info', actions = [], size = '', onOpen, dismiss = true, timeout = 0 }) {
  return new Promise(resolve => {
    const bg = document.createElement('div');

    bg.innerHTML = `<div class="modal ${size}" role="dialog" aria-modal="true">
      <div class="modal-h">${icon ? `<div class="mi ${tone}">${I[icon] || ''}</div>` : ''}<div style="flex:1;min-width:0"><h2>${esc(title)}</h2></div></div>
      <div class="modal-b">${body}${timeout ? `<div class="countdown"><i style="animation-duration:${timeout}s"></i></div>` : ''}</div>
      ${actions.length ? `<div class="modal-f">${actions.map((a, i) => `<button type="button" class="btn ${a.cls || 'btn-ghost'}" data-i="${i}">${a.icon ? I[a.icon] : ''}${esc(a.label)}</button>`).join('')}</div>` : ''}
    </div>`;
    let done = false, timer = null;
    const close = val => { if (done) return; done = true; clearTimeout(timer); bg.remove(); document.removeEventListener('keydown', onKey, true); resolve(val); };
    const ctx = { el: bg, close };
    const onKey = e => { if (e.key === 'Escape' && dismiss && bg === $$('.modal-bg').pop()) { e.stopPropagation(); close(null); } };
    document.addEventListener('keydown', onKey, true);
    bg.addEventListener('click', e => { if (e.target === bg && dismiss) close(null); });
    $$('.modal-f .btn', bg).forEach(b => b.addEventListener('click', async () => {
      const a = actions[+b.dataset.i];

        try { const v = await a.onClick(ctx); if (v !== false) close(v === undefined ? a.value : v); }
        catch (e) { toast(e.message, 'bad', 5000); }

      actions: [{ label: 'Bukan saya / Batal', value: null }, { label: 'Konfirmasi & Tanda Tangan', icon: 'check', cls: 'btn-accent', onClick: () => call() }]

      title: 'Presensi berhasil', icon: 'check', tone: 'ok', size: 'sm', timeout: 5,
      body: `<div style="text-align:center"><div style="font-size:20px;font-weight:800">${esc(res.nama)}</div><div class="muted">No. urut ${res.no} · ${fmtJam(res.waktu)} WIB</div><div class="big-qr" style="margin-top:12px">${qrSvg(verifyUrl(res))}</div><div class="muted" style="font-size:12.5px">QR ini adalah tanda tangan elektronik Anda pada daftar hadir.</div></div>`,
      actions: [{ label: 'Selesai', cls: 'btn-primary' }]
    });
  }
  function fail(msg, uid) {
    feedback(false);
    openModal({ title: 'Presensi gagal', icon: 'x', tone: 'danger', size: 'sm', timeout: 6, body: `<div class="muted">${esc(msg)}</div>${uid ? `<div class="mono muted" style="font-size:12px;margin-top:8px">UID: ${esc(uid)}</div>` : ''}`, actions: [{ label: 'Tutup', cls: 'btn-primary' }] });
  }

  async function onCard(uid, src) {
    if (busy || $('.modal-bg')) return;
    busy = true; setRadar('busy'); $('#scanTitle').textContent = 'Membaca data…'; $('#scanSub').textContent = `Kartu ${src} · ${uid}`;
    try {
      const emp = await api('lookupCard', { uid });
      await doCheckin({ ...emp, fromCard: true }, () => api('checkIn', { eventId, uid, metode: src === 'NFC' ? 'NFC HP' : src === 'Simulasi' ? 'Simulasi (demo)' : 'Reader RFID/NFC' }));
    } catch (e) { fail(e.message, uid); }
    finally { busy = false; setRadar(''); const t = $('#scanTitle'); if (t) { t.textContent = 'Tempelkan kartu pegawai'; $('#scanSub').textContent = 'Data diri Anda akan terisi otomatis.'; } }
  }
  Reader.on(onCard);

  const btnNfc = $('#btnNfc');
  const nfcOn = () => { $('#rNfc').classList.add('on'); $('#rNfcTxt').textContent = 'Aktif — tempelkan kartu di belakang HP'; const b = $('#btnNfc'); if (b) b.remove(); };
  if (btnNfc) {
    btnNfc.onclick = async () => { try { await Reader.startNFC(); nfcOn(); toast('NFC aktif', 'ok'); } catch (e) { toast('NFC gagal diaktifkan: ' + e.message, 'bad', 6000); } };
    if (Reader.nfc.active) nfcOn();
    else if (await Reader.nfcPermission() === 'granted') { try { await Reader.startNFC(); nfcOn(); } catch (e) { } }
  }
  const bm = $('#btnManual');
  if (bm) bm.onclick = async () => {
    const nipp = await openModal({
      title: 'Presensi dengan NIPP/NIK', icon: 'kbd', size: 'sm',
      body: `<div class="field"><label>NIPP / NIK</label><input class="input mono" id="mNipp" inputmode="numeric" autocomplete="off"></div>`,
      actions: [{ label: 'Batal', value: null }, { label: 'Lanjut', cls: 'btn-primary', onClick: ({ el }) => { const v = $('#mNipp', el).value.trim(); if (!v) throw new Error('NIPP/NIK wajib diisi'); return v; } }]
    });
    if (!nipp) return;
    busy = true;
    try { await doCheckin({ nama: '(dicocokkan dengan database)', nipp, jabatan: '', hp: '', email: '' }, () => api('checkInManual', { eventId, nipp })); }
    catch (e) { fail(e.message); }
    finally { busy = false; }
  };
  if (MODE === 'demo') {
    const list = await LocalAPI.demoEmployees();
    $('#simSel').innerHTML += list.map(e => `<option value="${esc(e.uid)}">${esc(e.nama)} — ${esc(e.uid)}</option>`).join('') + '<option value="DEADBEEF">Kartu tidak terdaftar — DEADBEEF</option>';
    $('#simBtn').onclick = () => { const v = $('#simSel').value; if (!v) return toast('Pilih kartu dahulu', 'warn'); Reader.last = ''; Reader.emit(v, 'Simulasi'); };
  }
  await refresh();
  const iv = setInterval(() => { if (!$('.modal-bg')) refresh(); }, CONFIG.KIOSK_REFRESH_MS);
  onCleanup(() => clearInterval(iv));
}

function csvCell(v) { v = String(v ?? ''); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }

    else if (c === '"') q = true; else if (c === sep) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase().replace(/[^a-z]/g, ''));
  const alias = { uid: 'uid', uidkartu: 'uid', kartu: 'uid', nama: 'nama', nipp: 'nipp', nik: 'nipp', nippnik: 'nipp', jabatan: 'jabatan', hp: 'hp', handphone: 'hp', nohp: 'hp', email: 'email' };
  return rows.filter(r => r.some(x => x.trim())).map(r => { const o = {}; head.forEach((h, i) => { if (alias[h]) o[alias[h]] = (r[i] || '').trim(); }); return o; });
}
function downloadText(name, text) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\uFEFF' + text], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function resizeImage(file, maxW, maxH) {
  return new Promise((ok, ko) => {
    const img = new Image(); img.onload = () => {
      const r = Math.min(1, maxW / img.width, maxH / img.height), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/png'));
    }; img.onerror = ko; img.src = URL.createObjectURL(file);
  });
}

/* ---------- Daftar hadir per agenda (admin) ---------- */
async function viewAdminAttendance(eventId) {
  app().innerHTML = loadingHTML;
  let ev, rows;
  try {
    ev = (await api('listEvents', { all: true })).find(e => e.id === eventId);
    if (!ev) { app().innerHTML = `<button class="back" onclick="go('#/admin')">${I.back} Kembali</button><div class="card empty">Agenda tidak ditemukan.</div>`; return; }
    rows = await api('listAttendance', { eventId });
  } catch (e) { app().innerHTML = errorCard(e.message); return; }
  app().innerHTML = `<button class="back" onclick="go('#/admin/agenda')">${I.back} Agenda Rapat</button>
    <div class="card card-pad" style="margin-bottom:16px;display:flex;gap:18px;flex-wrap:wrap;align-items:center">
      <div style="flex:1;min-width:240px"><div class="row" style="gap:8px;margin-bottom:6px">${ev.status === 'aktif' ? '<span class="badge ok">Presensi dibuka</span>' : '<span class="badge gray">Presensi ditutup</span>'}<span class="badge" id="cntB">${rows.length} hadir</span></div>
        <h2>${esc(ev.acara)}</h2><div class="muted">${esc(ev.hari)}, ${fmtTgl(ev.tanggal)}</div></div>
      <div class="row">
        <button class="btn btn-ghost" id="kiosk">${I.monitor} Mode Presensi</button>
        <button class="btn btn-ghost" id="toggle">${ev.status === 'aktif' ? I.lock + ' Tutup Presensi' : I.check + ' Buka Presensi'}</button>
        <button class="btn btn-ghost" id="prev">${I.eye} Pratinjau</button>
        <button class="btn btn-accent" id="pdf">${I.pdf} Export PDF A4</button>
      </div></div>
    <div class="card"><div class="toolbar" style="justify-content:space-between"><h3>Daftar Hadir</h3><button class="btn btn-primary btn-sm" id="manual">${I.plus} Tambah manual</button></div><div id="att"></div></div>`;
  const draw = () => {
    $('#att').innerHTML = attTable(rows, { admin: true });
    $('#cntB').textContent = rows.length + ' hadir';
    $$('#att [data-qr]').forEach(b => b.onclick = () => showESign(rows.find(r => r.id === b.dataset.qr), ev));
    $$('#att [data-del]').forEach(b => b.onclick = async () => {
      const r = rows.find(x => x.id === b.dataset.del);
      if (!await confirmDialog({ title: 'Hapus data kehadiran?', danger: true, ok: 'Ya, hapus', message: `Kehadiran <b>${esc(r.nama)}</b> (${fmtJam(r.waktu)} WIB) beserta e-sign-nya akan dihapus. QR yang sudah tercetak menjadi tidak valid.` })) return;
      try { await api('deleteAttendance', { id: r.id }); toast('Data kehadiran dihapus', 'ok'); rows = await api('listAttendance', { eventId }); draw(); } catch (e) { toast(e.message, 'bad'); }
    });
  };
  draw();
  $('#kiosk').onclick = () => go('#/hadir/' + encodeURIComponent(eventId));
  $('#toggle').onclick = async () => {
    const open = ev.status !== 'aktif';
    if (!await confirmDialog({ title: open ? 'Buka presensi?' : 'Tutup presensi?', message: open ? 'Agenda akan tampil di halaman peserta dan kartu dapat dipindai.' : 'Peserta tidak dapat lagi melakukan presensi untuk agenda ini.', ok: open ? 'Buka' : 'Tutup' })) return;
    try { await api('saveEvent', { id: ev.id, tanggal: ev.tanggal, hari: ev.hari, acara: ev.acara, status: open ? 'aktif' : 'selesai' }); toast(open ? 'Presensi dibuka' : 'Presensi ditutup', 'ok'); viewAdminAttendance(eventId); } catch (e) { toast(e.message, 'bad'); }
  };
  $('#pdf').onclick = () => withBusy($('#pdf'), () => exportPDF(ev, rows, false));
  $('#prev').onclick = () => withBusy($('#prev'), () => exportPDF(ev, rows, true));
  $('#manual').onclick = async () => {
    let emps; try { emps = await api('listEmployees'); } catch (e) { return toast(e.message, 'bad'); }
    const taken = new Set(rows.map(r => r.nipp)); const avail = emps.filter(e => !taken.has(e.nipp));
    if (!avail.length) return toast('Semua pegawai terdaftar sudah hadir', 'warn');
    openModal({
      title: 'Tambah kehadiran manual', icon: 'user',
      body: `<div class="field"><label>Pegawai</label><select class="input" id="mEmp">${avail.map(e => `<option value="${esc(e.id)}">${esc(e.nama)} — ${esc(e.nipp)}</option>`).join('')}</select><span class="hint">Untuk peserta yang lupa membawa kartu. Tercatat sebagai "Manual (admin)".</span></div>`,
      actions: [{ label: 'Batal' }, {

          const id = $('#mEmp', el).value, e = avail.find(x => x.id === id);
          if (!await confirmDialog({ title: 'Tambahkan kehadiran?', message: `<b>${esc(e.nama)}</b> akan dicatat hadir dan dibuatkan e-sign.` })) return false;
          await api('checkInManual', { eventId, employeeId: id }); toast('Kehadiran ditambahkan', 'ok');
          rows = await api('listAttendance', { eventId }); draw(); return true;
        }
      }]
    });
  };
}

/* =====================================================================
 *  EXPORT PDF A4 — meniru FORM DAFTAR HADIR RAPAT INTERNAL
 * ===================================================================== */
function loadImg(src) { return new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; }); }
async function exportPDF(ev, rows, preview) {
  if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('Pustaka PDF gagal dimuat. Periksa koneksi internet lalu muat ulang.');
  if (typeof qrcode === 'undefined') throw new Error('Pustaka QR gagal dimuat. Periksa koneksi internet lalu muat ulang.');
  const s = S.settings || {};
  const doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const W = 210, M = 12, CW = W - 2 * M;
  const logo = await loadImg(logoSrc());
  const logoFmt = /^data:image\/jpe?g/i.test(logoSrc()) ? 'JPEG' : 'PNG';

  const header = () => {
    doc.setDrawColor(0); doc.setLineWidth(0.3);
    doc.rect(M, 10, CW, 22);
    doc.line(M + 50, 10, M + 50, 32); doc.line(W - M - 46, 10, W - M - 46, 32);
    if (logo) { let h = 14, w = h * logo.width / logo.height; if (w > 44) { w = 44; h = w * logo.height / logo.width; } doc.addImage(logo, logoFmt, M + (50 - w) / 2, 10 + (22 - h) / 2, w, h); }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11.5); doc.setTextColor(0);
    const midX = M + 50 + (CW - 96) / 2;
    const tl = doc.splitTextToSize(s.judul || 'FORM DAFTAR HADIR RAPAT INTERNAL', CW - 102);
    doc.text(tl, midX, tl.length > 1 ? 17 : 19.5, { align: 'center' });
    doc.setFontSize(10.5); doc.text(s.kodeForm || '', midX, 27.5, { align: 'center' });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    const rx = W - M - 43;
    doc.text('NO. TERBIT', rx, 18.5); doc.text(': ' + (s.noTerbit || ''), rx + 21, 18.5);
    doc.text('NO. REVISI', rx, 25.5); doc.text(': ' + (s.noRevisi || ''), rx + 21, 25.5);
    doc.setFontSize(10);
    let y = 40;
    [['TANGGAL', fmtTgl(ev.tanggal)], ['HARI', ev.hari], ['ACARA', ev.acara]].forEach(([k, v]) => {
      doc.setFont('helvetica', 'bold'); doc.text(k, M, y); doc.text(':', M + 20, y);
      doc.setFont('helvetica', 'normal');
      const lines = doc.splitTextToSize(String(v || ''), CW - 24);
      doc.text(lines.slice(0, 2), M + 23, y);
      y += 5.5 * Math.min(lines.length, 2) + 0.5;
    });
    return y;
  };
  const acaraLines = Math.min(doc.setFontSize(10).splitTextToSize(String(ev.acara || ''), CW - 24).length, 2);
  const TOP = 40 + 6 * 2 + 5.5 * acaraLines + 3;

  const body = rows.map(r => [r.no, r.nama, r.nipp, r.jabatan, r.hp, r.email, '']);
  doc.autoTable({
    head: [['NO', 'NAMA', 'NIPP / NIK', 'JABATAN', 'HANDPHONE', 'EMAIL', 'TANDA TANGAN']],
    body: body.length ? body : [['', 'Belum ada peserta', '', '', '', '', '']],
    startY: TOP, margin: { top: TOP, left: M, right: M, bottom: 16 },
    theme: 'grid', rowPageBreak: 'avoid',
    styles: { font: 'helvetica', fontSize: 8, cellPadding: 1.6, lineColor: [0, 0, 0], lineWidth: 0.2, textColor: 0, valign: 'middle', minCellHeight: 17, overflow: 'linebreak' },
    headStyles: { fillColor: [235, 238, 247], textColor: 0, fontStyle: 'bold', halign: 'center', minCellHeight: 8, fontSize: 8 },
    columnStyles: { 0: { cellWidth: 9, halign: 'center' }, 1: { cellWidth: 37 }, 2: { cellWidth: 21, halign: 'center' }, 3: { cellWidth: 29 }, 4: { cellWidth: 24, halign: 'center' }, 5: { cellWidth: 34, fontSize: 7 }, 6: { cellWidth: 32 } },
    didDrawPage: () => header(),
    didDrawCell: d => {
      if (d.section !== 'body' || d.column.index !== 6 || !rows[d.row.index]) return;
      const r = rows[d.row.index], q = makeQR(verifyUrl(r)), n = q.getModuleCount();
      const size = Math.min(d.cell.height - 1.6, 15.4), ms = size / n, x0 = d.cell.x + 1.2, y0 = d.cell.y + (d.cell.height - size) / 2;
      doc.setFillColor(0, 0, 0);
      for (let rr = 0; rr < n; rr++) for (let cc = 0; cc < n; cc++) if (q.isDark(rr, cc)) doc.rect(x0 + cc * ms, y0 + rr * ms, ms + 0.02, ms + 0.02, 'F');
      doc.setFontSize(5.8); doc.setTextColor(60);
      doc.text(['E-SIGN', fmtJam(r.waktu), 'WIB'], x0 + size + 1.2, d.cell.y + d.cell.height / 2 - 2);
      doc.setTextColor(0); doc.setFontSize(8);
    }
  });

  const pages = doc.internal.getNumberOfPages();
  const printed = `${fmtTgl(todayYmd())} ${new Date().toTimeString().substr(0, 5)}`;
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    doc.setFontSize(6.8); doc.setTextColor(90); doc.setFont('helvetica', 'normal');
    doc.text('Dokumen dibuat secara elektronik oleh Sistem Presensi Rapat Digital (NFC/RFID). Tanda tangan berupa QR e-sign dapat diverifikasi dengan memindai kode.', M, 288);
    doc.text(`Dicetak ${printed}  ·  Total hadir: ${rows.length}  ·  Halaman ${i} dari ${pages}`, W - M, 292, { align: 'right' });
    doc.setTextColor(0);
  }
  const fname = `Daftar_Hadir_${ev.tanggal}_${String(ev.acara).replace(/[^\w]+/g, '_').substr(0, 40)}.pdf`;
  if (preview) {
    const w = window.open(doc.output('bloburl'), '_blank');
    if (!w) { doc.save(fname); toast('Pop-up diblokir, PDF diunduh', 'warn'); }
  } else { doc.save(fname); toast('PDF diunduh: ' + fname, 'ok'); }
  return doc;
}

/* =====================================================================
 *  INIT
 * ===================================================================== */
function applyBrand() {
  $('#brandLogo').src = logoSrc();
  const map = { gas: ['ok', 'Online'], remote: ['ok', 'Online'], demo: ['warn', 'Mode Demo'] };
  const pill = $('#modePill'); pill.className = 'pill ' + map[MODE][0]; pill.lastElementChild.textContent = map[MODE][1];
  $('#foot').textContent = `${S.settings && S.settings.kodeForm ? S.settings.kodeForm + ' · ' : ''}Presensi Rapat Digital — NFC · RFID · QR E-Sign`;
}
async function loadSettings() {
  try { S.settings = await api('getSettings'); S.appUrl = S.settings.appUrl || ''; }
  catch (e) { S.settings = S.settings || {}; toast(e.message, 'bad', 6000); }
  applyBrand();
}
function getQueryParams() {
  return new Promise(res => {
    if (MODE === 'gas' && google.script.url) google.script.url.getLocation(l => res(l.parameter || {}));
    else res(Object.fromEntries(new URLSearchParams(location.search)));
  });
}
(async function init() {
  Reader.initKeyboardWedge();
  applyBrand();
  await loadSettings();
  const q = await getQueryParams();
  if (q.v && q.v.includes('.')) { const [vid, vs] = q.v.split('.'); location.hash = `#/verify/${encodeURIComponent(vid)}/${encodeURIComponent(vs)}`; }
  else if (q.verify) location.hash = `#/verify/${encodeURIComponent(q.verify)}/${encodeURIComponent(q.s || '')}`;
  window.addEventListener('hashchange', route);
  route();
  // Catatan: Chrome otomatis menjeda NFC saat layar mati/halaman tersembunyi dan melanjutkannya kembali.
})();
</script>
